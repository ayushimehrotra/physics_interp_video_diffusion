# F7. Free fall, projectiles and floor bounces (spec §2.3; physlaw/data/families/f7_freefall.py).
defaults: _master.yaml
family: f7
seed_offset: 700000
n_groups: 700
subfamilies: {projectile: 300, drop: 200, bounce: 200}
nuisance_frac: 0.2
acceptance:
  physics_check_tol: 0.05
twins:
  # Bounce sub-family only: one twin eps<e> per rung, first-bounce restitution e (rebound apex e^2 x drop
  # height); e <= 1 legal, e > 1 creates energy. Later bounces at 0.8. Projectile and drop are unchanged.
  # 21 rungs, step 0.05 (user decision 2026-11-11); twin names eps0.5, eps0.55, ..., eps1.0, ..., eps1.5
  bounce_ladder: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.05, 1.10, 1.15, 1.20, 1.25, 1.30, 1.35, 1.40, 1.45, 1.50]
