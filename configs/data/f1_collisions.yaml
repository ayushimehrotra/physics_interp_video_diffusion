# F1. Two-body collisions, five twins per group (spec §2.2).
defaults: _master.yaml
family: f1
n_groups: 400
seed_offset: 100000
twins:
  e_sim: 1.0                       # one simulation per group, at e = 1
  e_low: 0.15
  e_create: 1.5                    # energy_create: lambda = (1 + 1.5) / (1 + e_sim)
  split_delta_range: [0.10, 0.35]  # |s' - s|, s = m_A/(m_A+m_B); the old conservation_set_v1 range
  split_margin: 0.05               # keep s' in [0.05, 0.95]: no ball deflected backwards
  # Drift sign chosen to LOWER |v_cm| (twins.ke_reducing_sign); random sign makes ~half the
  # violating twins also create energy. Measured on 64 seeds: mom_violate_e015 still creates
  # energy in 14/64 -> rejected below so its contrast with conserve_e015 is momentum-only.
  # mom_violate_e1 creates energy in ~half of groups and CANNOT be avoided at e = 1 when
  # v_cm . n ~ 0; every clip records physlaw.energy_physical, so stratify on it.
  split_sign: ke_reducing
  require_energy_physical: [mom_violate_e015]
