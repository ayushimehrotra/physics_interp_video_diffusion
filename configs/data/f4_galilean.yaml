# F4. Galilean boosts (spec §2.3): the F1 legal twins (e = 1, e = 0.15) under a common velocity
# u in {0, small, large} (direction sampled per group). Restitution and the centre-of-mass-frame
# scattering angle are invariant. The camera is raised from 20 to 30 m so the boosted clips stay
# in frame ("enlarge the floor"; the 40 m floor already exceeds the 25 x 14 m view).
# Twins with the same boost share every pre-contact frame (pre_segment = u0 / usmall / ularge).
defaults: _master.yaml
family: f4
n_groups: 200
seed_offset: 400000
nuisance_frac: 0.2
camera_distance: 30.0
twins:
  e_sim: 1.0
  e_low: 0.15
  u_small: [0.15, 0.30]            # |u| in world units / s (sphere speeds are 0.35-1.55)
  u_large: [0.45, 0.70]
