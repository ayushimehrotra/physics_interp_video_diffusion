# F6. Coulomb friction on one uniform surface (slide: legal / reverse / viscous / decel ladder; no_friction dropped
# 2026-11-12 by the user: its glide set the camera span and shrank the other effects),
# mass-independent pairs, force-free glides (spec §2.3; physlaw/data/families/f6_friction.py). Laws: friction (slide,
# pair), momentum / Newton I (glide). Seeds are assigned to sub-families in consecutive blocks of these sizes.
defaults: _master.yaml
family: f6
seed_offset: 600000
n_groups: 650
subfamilies: {slide: 300, pair: 200, glide: 150}
nuisance_frac: 0.2
acceptance:
  physics_check_tol: 0.02          # m; Bullet box-on-slab friction (960 Hz) matches the closed form to ~2 mm
twins:
  # slide: deceleration x k from the branch (an equality law: L2 contrasts; x0.85 + x1.15 is the speed-matched pair)
  slide_decel_ladder: [0.7, 0.85, 1.15, 1.3]
  # glide: |v'| = s |v| after the branch, same direction (s = 1 is the legal twin; Newton I is an equality law,
  # so L2 reports legal-vs-violator contrasts, not a kink); plus one turn twin at the same speed.
  glide_speed_ladder: [0.7, 0.8, 0.9, 1.1, 1.2, 1.3]
  glide_turn_deg: 20
