# L4 causal propagation (spec §5.6). Stage 6 with this config loads the model (GPU) for the interventions.
defaults: _probe.yaml
level: l4
families: [f3]
alphas_sd: [-2, -1, 0, 1, 2]       # shift along the mass-ratio direction, in sd of the activations' projection on it
layer: auto                        # injection block: best grouped-CV R² for log(m_A/m_B) from roi_A.pre, or a layer key
direction_data: null               # family the direction is fitted on; null = the evaluated one (spec: F3, mass not
                                   # confounded with look). data/f1 only as a labelled stand-in (mass ~ visible size)
probe_data: null                   # family the post-velocity probes are trained on; null = this one, cross-fitted
twins: null                        # evaluated twins (null: all; F3's twins are its mass ratios)
e_ref: twin                        # restitution in the momentum prediction: the twin's own, or a number
controls: {random_dir: 2, random_subspace: 2, pc_matched: 1}   # draws per control
max_groups: null                   # first N groups only (test runs)
generate_readout: true             # generators: read each steered video out with the track B readout (steering)
bootstrap: {n: 1000}
device: cuda
