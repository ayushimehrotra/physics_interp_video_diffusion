defaults: _probe.yaml
level: l2
families: [f1, f2, f6, f7, f8, f9, f10, f11, f12]
# Spec §5.0.4 L2. Pairwise contrasts per family (`list`; `law` of each entry, default momentum; `viol` one twin or a
# list scored as one contrast with every (violator, legal) pair a row; the legal-vs-legal `calibration` pair and any
# `controls` pairs are scored as reference contrasts: two legal outcomes, nothing broken); magnitude `eta` = the momentum-exchange
# imbalance of the violating twin from its labels; stratify: boolean physlaw label to split the contrast on;
# primary: the headline contrast (listed first), exactly one per law in each family's `list` (l2_surprise.family_contrasts
# raises otherwise; group_contrasts carry none). e015 is primary: a law-perfect observer assuming the wrong
# restitution still wins it 0.95-1.00 for any e, but wins the e1 contrast only 0.53 if it assumes e = 0.
# Motion control: model − pixel-baseline win rate (paired CI) and, on F2, speed-matched violators. Raw scores only.
# Energy: no pairwise contrast (R5); the kink K along the ε ladder (`energy_kink` entries; L2-rep on the same
# ladder). Every surprise is restricted to the group's clean window (labels clean_until_s, spec §5.0.2).
# A contrast with several violators (a speed-matched pair) is also reported per half (`[half <twin>]` rows), and every
# contrast records the share of groups whose violator also creates energy (labels energy_physical False; audit M3:
# F6 glide speed_x > 1, F12 spin_x > 1, F2 *_pos, F6 reverse), flagged in the md.
# F3 (hidden mass) is not an L2 family: all its twins are legal (mass ratios at identical pre-event frames), so there
# is no violation to contrast; it serves L0 (mass decodable only from the post-event outcome) and L1 energy.
contrasts:
  f1:
    calibration: [conserve_e1, conserve_e015]
    list:
      - {viol: mom_violate_e015, legal: conserve_e015, magnitude: eta, stratify: energy_physical, primary: true}
      - {viol: mom_violate_e1, legal: conserve_e1, magnitude: eta, stratify: energy_physical}
  # F2: restitution ladder e0.0..e1.5 (e > 1 creates energy; twins.level_name) + the off-ladder legal twin e0.15 +
  # momentum violators mom_violate_e<e:g>_<pos|neg> (e = 1, 0.5, 0.15; both drift signs) in the SAME twin group.
  f2:
    calibration: [e1.0, e0.0]            # legal-vs-legal reference contrast
    list:                                # same-e pairs (also the L2b momentum contrasts); primary: e0.15 with the KE-
      # reducing drift sign (neg, as F1's e015); the pos sign, the other e and speed_matched are secondary
      - {viol: mom_violate_e0.15_neg, legal: e0.15, magnitude: eta, stratify: energy_physical, primary: true}
      - {viol: mom_violate_e0.15_pos, legal: e0.15, magnitude: eta, stratify: energy_physical}
      - {viol: mom_violate_e0.5_neg, legal: e0.5, magnitude: eta, stratify: energy_physical}
      - {viol: mom_violate_e0.5_pos, legal: e0.5, magnitude: eta, stratify: energy_physical}
      - {viol: mom_violate_e1_neg, legal: e1.0, magnitude: eta, stratify: energy_physical}
      - {viol: mom_violate_e1_pos, legal: e1.0, magnitude: eta, stratify: energy_physical}
    # legal twins the speed matching may pick (the ladder's legal rungs + the off-ladder violator partner e0.15)
    ladder: [e0.0, e0.1, e0.15, e0.2, e0.3, e0.4, e0.5, e0.6, e0.7, e0.8, e0.9, e1.0]
    group_contrasts:
      # Speed-matched F2 momentum contrast (secondary): each violator (both drift signs) vs the legal ladder twin closest in post-contact
      # KE (match: ke) or total speed (match: speed). Left out (n_unmatched): |log gap| > max_log_gap, and with
      # require_bracketed a violator outside the ladder's range. balance_faster: violators faster / slower than their
      # partner get equal total weight, so an observer of the match scalar alone sits at 0.5.
      - {name: speed_matched, kind: speed_matched, viol_prefix: mom_violate, match: ke, max_log_gap: 0.1,
         require_bracketed: true, balance_faster: true}
      # Energy kink on the ε ladder (dose = the number in the twin name; equal steps). K = Δ²s(1) − median Δ²s at the
      # other interior doses, excluding doses within exclude_radius of the model's x̂ (leave-one-group-out);
      # inconclusive if |x̂ − 1| < exclude_radius; groups with |stop_dose − 1| < exclude_radius excluded (reported
      # apart). Must beat both pixel baselines (paired CIs); the untrained model's K CI must hold 0 (its own run).
      - {name: energy_kink, kind: energy_kink,
         twins: [e0.0, e0.1, e0.2, e0.3, e0.4, e0.5, e0.6, e0.7, e0.8, e0.9, e1.0, e1.1, e1.2, e1.3, e1.4, e1.5],
         x0: 1.0, exclude_radius: 0.2}
  # F6: glide (Newton I, law momentum), slide and pair (law friction); each sub-family names its legal twin "legal",
  # and a contrast keeps the groups holding both its twins. Equality laws: contrasts, not kinks. Primary glide
  # contrast: the speed-matched pair speed_x0.9 + speed_x1.1 (one violator slower, one faster than the legal twin: a
  # speed-only observer wins exactly half). Primary friction contrast: reverse (the naive constant-acceleration
  # extrapolation through v = 0; differs from legal only after the stop; also creates energy). reverse / viscous move
  # MORE than legal after the branch, so decel_x0.85 + decel_x1.15 (one moves more, one less) is friction's
  # speed-matched motion control. No legal-vs-legal control: one surface and one mu make the Coulomb outcome unique
  # given the shared pre-event frames (the pre frames show the deceleration), and twins of different groups do not
  # share a context; the pixel baselines and the speed-matched pairs are F6's motion controls. No no_friction twin
  # (dropped 2026-11-12, user). Glide speed_x1.1 / 1.2 / 1.3 also create kinetic energy (energy_physical False): read
  # the primary pair's `[half speed_x0.9]` row (speed lost, energy legal) beside `[half speed_x1.1]`.
  f6:
    list:
      - {viol: [speed_x0.9, speed_x1.1], legal: legal, law: momentum, primary: true}
      - {viol: reverse, legal: legal, law: friction, primary: true}
      - {viol: viscous, legal: legal, law: friction}
      - {viol: [decel_x0.85, decel_x1.15], legal: legal, law: friction}
      - {viol: decel_x0.7, legal: legal, law: friction}
      - {viol: decel_x1.3, legal: legal, law: friction}
      - {viol: heavy_x13, legal: legal, law: friction}
      - {viol: turn_20, legal: legal, law: momentum}
      - {viol: speed_x0.7, legal: legal, law: momentum}
      - {viol: speed_x0.8, legal: legal, law: momentum}
      - {viol: speed_x0.9, legal: legal, law: momentum}
      - {viol: speed_x1.1, legal: legal, law: momentum}
      - {viol: speed_x1.2, legal: legal, law: momentum}
      - {viol: speed_x1.3, legal: legal, law: momentum}
  # F7 projectile / drop (law gravity; a contrast keeps the groups holding its twins): projectile gravity_x15 (g x1.5
  # after the branch: constant g) and vx_x06 (horizontal velocity x0.6: axis independence), drop heavy_x13 (the
  # heavier ball falls at 1.3 g: mass independence), each vs legal. NO legal-vs-legal control (dropped 2026-11-12,
  # user): the two F7 legal twins (legal, legal_e04: floor restitution 0.8 / 0.4) are identical up to the first floor
  # contact, which ends the clean window (labels clean_until_s), so inside the window they show the SAME frames and
  # the pair could only score 0.5 by construction; the pixel baselines are F7's motion control. (legal_e04 stays in
  # the data: L3 mass independence reads it as a legal row.) F7 bounce: floor bounce ladder eps0.5, eps0.55, ...,
  # eps1.5 (ε = −v'·ĝ / v·ĝ); the other F7 groups lack these twins and are skipped.
  f7:
    list:
      - {viol: gravity_x15, legal: legal, law: gravity, primary: true}
      - {viol: vx_x06, legal: legal, law: gravity}
      - {viol: heavy_x13, legal: legal, law: gravity}
    group_contrasts:
      - {name: energy_kink_bounce, kind: energy_kink, x0: 1.0, exclude_radius: 0.2,
         twins: [eps0.5, eps0.55, eps0.6, eps0.65, eps0.7, eps0.75, eps0.8, eps0.85, eps0.9, eps0.95, eps1.0, eps1.05, eps1.1, eps1.15, eps1.2, eps1.25, eps1.3, eps1.35, eps1.4, eps1.45, eps1.5]}
  # F8 Galileo's ramp: pad on the run-out, ε = s'/s, ladder eps0.5, eps0.55, ..., eps1.5.
  f8:
    group_contrasts:
      - {name: energy_kink, kind: energy_kink, x0: 1.0, exclude_radius: 0.2,
         twins: [eps0.5, eps0.55, eps0.6, eps0.65, eps0.7, eps0.75, eps0.8, eps0.85, eps0.9, eps0.95, eps1.0, eps1.05, eps1.1, eps1.15, eps1.2, eps1.25, eps1.3, eps1.35, eps1.4, eps1.45, eps1.5]}
  # F9 pendulum. pair groups: period contrasts vs the one legal twin (law oscillation). swing groups: the damper ladder
  # eps0.5 ... eps1.5 (ε = sqrt(h_apex' / h_apex)), kink at ε = 1; window [event, min over rungs of clean_until_s]
  # (the next damper entry).
  f9:
    list:
      - {viol: period_x0.8, legal: legal, law: oscillation, primary: true}
      - {viol: period_x1.25, legal: legal, law: oscillation}
      - {viol: heavy_x0.8, legal: legal, law: oscillation}
    group_contrasts:
      - {name: energy_kink_swing, kind: energy_kink, x0: 1.0, exclude_radius: 0.2,
         twins: [eps0.5, eps0.55, eps0.6, eps0.65, eps0.7, eps0.75, eps0.8, eps0.85, eps0.9, eps0.95, eps1.0, eps1.05, eps1.1, eps1.15, eps1.2, eps1.25, eps1.3, eps1.35, eps1.4, eps1.45, eps1.5]}
  # F10 rolling (law rolling; physlaw/data/families/f10_rolling.py): hollow_first (the two accelerations swapped: the
  # same pair of motions, so a speed-only observer has no cue; primary), tie (the tube at the solid's acceleration),
  # slip_w2 (legal translation, spin w = 2 v / r), each vs legal. One legal twin per group: no legal-vs-legal control.
  f10:
    list:
      - {viol: hollow_first, legal: legal, law: rolling, primary: true}
      - {viol: tie, legal: legal, law: rolling}
      - {viol: slip_w2, legal: legal, law: rolling}
  # F11 statics: across-group kink on constants.overhang_x (grid 0.55 ... 1.45, symmetric about the boundary 1). Per
  # group c = log S(violating) − log S(legal) (tip violates below 1, stay above): the law is c > 0 on both sides; a
  # motion correlate gives c linear through 1 (or a step). x0 = 1 sits between grid points (midpoint stencil).
  f11:
    group_contrasts:
      - {name: statics_kink, kind: group_kink, twins: [stay, tip], dose: overhang_x, x0: 1.0, exclude_radius: 0.15}
  # F12 angular momentum (equality law: contrasts), legal_e04 vs legal the legal-vs-legal control (two restitutions).
  # Primary (audit M3, 2026-11-12): the KE-conserving pair spin_ke_x0.8 + spin_ke_x1.2 (bar spin x k, the radial
  # relative translation pays for the spin energy: linear momentum, orbital L and the total KE equal the legal twin's,
  # so only L breaks; one twin translates faster, one slower than legal). spin_x<k> (spin x k, linear velocities
  # legal) are secondary: x1.1 creates energy in ~half the groups, x1.2 / x1.3 in nearly all (energy_physical False).
  f12:
    calibration: [legal_e04, legal]
    list:
      - {viol: [spin_ke_x0.8, spin_ke_x1.2], legal: legal, law: angular_momentum, primary: true}
      - {viol: spin_ke_x0.8, legal: legal, law: angular_momentum}
      - {viol: spin_ke_x1.2, legal: legal, law: angular_momentum}
      - {viol: [spin_x0.9, spin_x1.1], legal: legal, law: angular_momentum}
      - {viol: spin_x0.7, legal: legal, law: angular_momentum}
      - {viol: spin_x0.8, legal: legal, law: angular_momentum}
      - {viol: spin_x0.9, legal: legal, law: angular_momentum}
      - {viol: spin_x1.1, legal: legal, law: angular_momentum}
      - {viol: spin_x1.2, legal: legal, law: angular_momentum}
      - {viol: spin_x1.3, legal: legal, law: angular_momentum}
group_n_boot: 1000                      # bootstrap draws (over groups) of the group contrasts, kink and L2-rep
# Pixel baselines (scripts/05_surprise.py, per-frame so the clean window applies): copy-last-frame reproduces every
# impossible-vs-legal energy asymmetry on V-JEPA 2 (replication/RESUME.md 2026-11-02).
pixel_baselines: [copy_last_frame, constant_velocity_extrapolation]
