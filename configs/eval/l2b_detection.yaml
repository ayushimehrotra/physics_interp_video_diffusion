# L2b trained violation detection (spec §5.0.4): the L2 pairwise contrasts of the laws in l2b_detection.L2B_LAWS
# (momentum incl. the F6 glide, gravity F7 projectile / drop, friction F6 slide / pair, oscillation F9 pair, rolling F10
# (hollow_first / tie / slip_w2 vs legal), angular_momentum F12); never energy (R5: use
# L2-rep) or statics. Each with the kinematic baseline (true post-event kinematics from labels).
defaults: l2_surprise.yaml
level: l2b
families: [f1, f2, f6, f7, f9, f10, f12]
l2b:
  fold_seeds: 4            # grouped 5-fold x 4 seeds (cross-fitting allowed below 100 groups, spec §5)
  speed_matched_tol: 0.05  # speed-matched stratum: groups with |log ke_ratio_to_legal| < tol (both drift signs on F2)
  n_boot: 1000             # group bootstrap: selected-cell AUC CI, paired model − kinematic AUC CI
  norm_routes: true        # fitted_norm (ridge -> true Δp, score |Δp̂|) and composed_norm (ridge -> dv_A, dv_B, true masses)
  # lambdas: default = probe.alphas (logistic L2 penalty grid, standardised features)
  # Transfer test: train on one contrast, score the other (grouped); compare with the kinematic baseline's transfer
  # (F1 violators are slower in both contrasts, so speed alone transfers partly).
  transfer:
    f1:
      - {train: [mom_violate_e1, conserve_e1], test: [mom_violate_e015, conserve_e015]}
      - {train: [mom_violate_e015, conserve_e015], test: [mom_violate_e1, conserve_e1]}
