# L3 invariance (spec §5.5). Stage 6 (--level configs/eval/l3_invariance.yaml) runs the analyses listed for the
# family of --data, from stage 4's cache. Label keys are dotted paths into labels.json.
defaults: _probe.yaml
level: l3
families: [f4, f6, f7, f1]
fold_seeds: 2                 # outer CV repeats (each with held-out (pool, layer) selection inside)
bootstrap: {n: 2000}
analyses:
  f4: [galilean]
  f6: [mass_independence, transfer]
  f7: [mass_independence, transfer]
  f1: [transfer]              # clean -> nuisance
galilean:
  boost_key: physlaw.boost.level        # base level = u = 0; other levels are boosts
  base_level: "0"
  boost_vec_key: physlaw.boost.u        # boost velocity (for the error-vs-boost-size figure)
  pair_key: physlaw.seed                # a boosted clip's u = 0 partner shares this key (and the twin name)
  targets: [restitution, com_angle]
  pools: [roi_pair.all, frame.all]
  layers: all
  l2_config: configs/eval/l2_surprise.yaml   # L2 repeated on each boost level's twins
mass_independence:
  families:
    f7: {subfamily: drop_pair, target: accel_z, objects: [A, B], legal: [legal], violating: [heavy_accel]}
    f6: {subfamily: slide, target: decel, objects: [A, B], legal: [legal], violating: [heavy_decel]}
transfer:
  f6: {split_key: physlaw.geometry, conditions: [flat, incline], targets: [mu, accel, size], pools: [roi_A.all, frame.all]}
  f7: {split_key: physlaw.nuisance, conditions: [0, 1], targets: [velocity, size], pools: [roi_A.all, frame.all]}
  f1: {split_key: physlaw.nuisance, conditions: [0, 1], targets: [velocity, log_mass, radius],
       pools: [roi_A.pre, frame.pre]}
