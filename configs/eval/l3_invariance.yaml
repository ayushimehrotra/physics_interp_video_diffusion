# L3 invariance (spec §5.5). Stage 6 (--level configs/eval/l3_invariance.yaml) runs the analyses listed for the
# family of --data, from stage 4's cache. Label keys are dotted paths into labels.json.
defaults: _probe.yaml
level: l3
families: [f4, f6, f7, f1]
fold_seeds: 2                 # outer CV repeats (each with held-out (pool, layer) selection inside)
bootstrap: {n: 2000}
min_groups: 4                 # fewer groups: the analysis is skipped (test runs may lower it)
analyses:
  f4: [galilean, momentum_invariance]
  f6: [mass_independence, transfer]
  f7: [mass_independence, transfer]
  f1: [transfer]              # clean -> nuisance
galilean:                             # F4: a group holds every boost level (twins <level>_e1, <level>_e015)
  boost_key: physlaw.edit.boost_level   # the u = 0 level is the base; the others are boosts
  base_level: u0
  boost_vec_key: physlaw.edit.boost     # boost velocity u (for the error-vs-boost-size figure)
  pair_keys: [physlaw.twin_group_id, physlaw.edit.e]   # a boosted clip's u = 0 partner: same group, same e
  cv_key: physlaw.twin_group_id
  targets: [restitution, com_angle]
  pools: [roi_pair.all, frame.all]
  layers: all
  l2_contrasts: {calibration: ["{level}_e1", "{level}_e015"], list: []}   # L2 per boost level (F4: legal twins only)
momentum_invariance:                  # F4: eta / antiparallel of decoded post velocities per boost level (levels, pairs,
  pools: [roi_pair.all, frame.all]    # CV unit from galilean); probes for physlaw.post_velocity A, B (x, y) on u = 0
  layers: all
mass_independence:                    # per-object target over window_s after the event; twins as the data generator names them
  families:
    f7: {subfamily: drop, target: accel_z, window_s: 0.2, objects: [A, B], legal: [legal, legal_e04], violating: [heavy_x13]}
    f6: {subfamily: slides, target: decel, window_s: 0.5, objects: [A, B], legal: [legal_mu1, legal_mu2], violating: [heavy_x13]}
transfer:                             # train on conditions[0], test on conditions[1], and back
  f6: {split_key: physlaw.subfamily, conditions: [flat, incline], twins: [legal_mu1, legal_mu2], targets: [mu, accel, size],
       pools: [roi_A.all, frame.all]}
  f7: {split_key: physlaw.nuisance, conditions: [0, 1], targets: [velocity, size], pools: [roi_A.all, frame.all]}
  f1: {split_key: physlaw.nuisance, conditions: [0, 1], targets: [velocity, log_mass, radius], pools: [roi_A.pre, frame.pre]}
