# PC1 positive control (spec §4.4): V-JEPA-style encoder + predictor at ViT-S scale, trained on the PC
# training render set. Same input as V-JEPA 2 ViT-L (64 frames at 24 fps centred on the event, 256x256 squash,
# patch 16, tubelet 2, ImageNet normalisation), so stages 03-06 run on it unchanged.
#   train: scripts/10_train_positive_control.py --config configs/models/positive_control.yaml
#   eval:  scripts/04_cache_activations.py --model configs/models/positive_control.yaml --data data/f1, then 05, 06
defaults: vjepa2_vitl.yaml
name: pc1-vits
kind: positive_control
positive_control: pc1
hf_id: null                  # trained here; not a hub checkpoint
revision: null
local_path: ${env:PHYSLAW_MODELS,/root/models}/pc1-vits   # stage 10 output: pc1.pt (eval), train_state.pt, curves
sha256: null                 # V-JEPA 2 pins do not apply; pc1.pt is this repo's own training output
dtype: float32
layers: [0, 2, 4, 6, 8, 10, 11]
arch:
  dim: 384                   # ViT-S/16 encoder (22M parameters)
  depth: 12
  heads: 6
  pred_dim: 384              # predictor as V-JEPA 2 ViT-L's (12 x 384)
  pred_depth: 12
  pred_heads: 12
  init_seed: 0

data:
  # PC training render set (wp-data): legal clips only, seeds disjoint from the evaluation twins.
  root: data/pc1              # <root>/<family>/<group>/<twin>/ (configs/data/pc1_train.yaml writes it)
  code_path_test: false      # true only for runs on stand-in data (labelled in curves and plot)
  families: [f1, f2, f3, f4, f7, f8, f9, f11, f12]   # every family of configs/data/pc1_train.yaml
  exclude_eval: [data/f1, data/f2, data/f3, data/f4, data/f6, data/f7, data/f8, data/f9, data/f10, data/f11,
                 data/f12]
  train_splits: [train, test]
  holdout_splits: [val]      # in-distribution prediction error (spec §4.4)
  n_holdout: 64
  jitter: 24                 # master frames (+-0.5 s) of window shift around the eval placement
  flip: true

mask:
  p_future: 0.75             # share of steps with a future-frame mask (the eval forecast setting)
  future_ctx: [8, 24]        # context token-frames k (eval: 16 = 32 input frames before the event)
  tube_blocks: [[8, 0.15], [2, 0.7]]   # V-JEPA multi-block: (n blocks, area fraction each)
  aspect: [0.75, 1.5]

train:
  # Full run (9 families x >= 3,000 legal clips; ~35 epochs). Measured on an RTX 6000 Ada: ~4.6 s/step of compute at
  # batch 32, 5.4 GB peak at micro_batch 8 -> 30k steps ~ 38 GPU-h (~15-20 h on one H100). micro_batch 32: ~20 GB (extrapolated).
  steps: 30000
  batch_size: 32
  micro_batch: 8             # gradient accumulation to batch_size
  lr: 5.0e-4
  final_lr: 1.0e-6
  warmup: 1500
  weight_decay: 0.04
  betas: [0.9, 0.999]
  grad_clip: 1.0
  ema: [0.998, 1.0]          # linear over training (V-JEPA)
  grad_checkpointing: true
  num_workers: 4
  log_every: 20
  eval_every: 500
  save_every: 500
  seed: 0

pass_criterion:              # spec §4.4 / §5.0.5 (momentum accepted by the user 2026-11-10)
  momentum_family: f1
  l1_s_mom_min: 0.5                # L1 S_mom (spec §5.0.4), held-out selected over spaces
  l1_pools: [frame, contact]       # leak-free pools, first one present (roi leaks the post location: never used)
  l2_win_min: 0.7                  # raw win rate (no regression adjustment), and model − pixel-baseline win CI > 0
  l2_distance: l1_obj              # pre-registered: object-region L1 (no selection over distances)
  l2_contrasts: ["mom_violate_e1 vs conserve_e1", "mom_violate_e015 vs conserve_e015"]
  l2_control: "conserve_e1 vs conserve_e015"   # legal-vs-legal reference, reported only
  energy:                          # spec §5.0.5: raw L2 kink with CI > 0 beyond every baseline on F2 OR F7 bounce,
    entries: {f2: energy_kink, f7: energy_kink_bounce}   # and the untrained model's K CI containing 0 (same entry)
    distance: l1_obj               # pre-registered, as for momentum
