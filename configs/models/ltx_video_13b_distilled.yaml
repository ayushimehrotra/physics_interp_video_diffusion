# LTX-Video 0.9.8 13B distilled (spec §4.2 group 4): output track A, NATIVE multi-frame conditioning
# (physlaw/models/ltx.py). LTX-Video Open Weights License, not gated. diffusers LTXConditionPipeline +
# LTXVideoCondition(video=<context>, frame_index=0) (diffusers >= 0.34; physics_venv 0.35.1; the repo's
# model_index.json is from 0.34.0.dev0).
# OFFICIAL settings. Model card: sizes divisible by 32, frame counts 8k+1, "works best" under 720 x 1280 and 257
# frames; the diffusers examples save at 24 fps. Distilled sampling (diffusers LTX docs for the distilled
# checkpoints; github.com/Lightricks/LTX-Video configs/ltxv-13b-0.9.8-distilled.yaml first pass: 7 timesteps
# 1.0 ... 0.725, guidance 1, decode_timestep 0.05, decode_noise_scale 0.025): timesteps
# [1000, 993, 987, 981, 975, 909, 725, 0.03], guidance_scale 1.0 (guidance-distilled; guidance_rescale 0.7 as the
# docs pass it, inert at guidance 1), image_cond_noise_scale 0.0, bf16, VAE tiling.
# DEVIATION: single pass at the final 480 x 832; the official multi-scale recipe (2/3-size first pass, latent
# spatial upsampler, 3-step refinement) is not run: its 0.9.8 diffusers upsampler repo is not public.
# fps 24: every 2nd master frame (24 divides 48; the card's 30 fps does not). Download only model_index.json,
# scheduler/, tokenizer/, text_encoder/, transformer/, vae/*.json + vae/diffusion_pytorch_model.safetensors (~41 GB):
# the repo also carries a stray second copy of text_encoder/ and transformer/ under vae/ (~52 GB, unused).
name: ltx-video-0.9.8-13b-distilled
kind: generator
output_track: A
track_a_mode: native      # multi-frame conditioning items are part of LTX-Video's training
hf_id: Lightricks/LTX-Video-0.9.8-13B-distilled
revision: 7c64400e1861cc0d7b98d570a1926d5408ec60cd
local_path: ${env:PHYSLAW_MODELS,/root/models}/LTX-Video-0.9.8-13B-distilled
dtype: bfloat16
vae_tiling: true
official:
  height: 480
  width: 832
  num_frames: 121         # 8k+1; 5.04 s at 24 fps
  fps: 24
  timesteps: [1000, 993, 987, 981, 975, 909, 725, 0.03]
  num_inference_steps: 8  # = len(timesteps); the pipeline uses timesteps
  guidance_scale: 1.0
  guidance_rescale: 0.7
  decode_timestep: 0.05
  decode_noise_scale: 0.025
  image_cond_noise_scale: 0.0
  scheduler: FlowMatchEulerDiscreteScheduler   # shipped
  negative_prompt: "worst quality, inconsistent motion, blurry, jittery, distorted"   # model card (inert at guidance 1)
input:
  center_on_contact: true             # 121 frames at 24 fps (241 master frames) around contact: ~60 pre-contact
token_grid: {patch: 1, vae_spatial: 32, vae_temporal: 8}   # LTX VAE 32x32x8, patch 1 (eval Geometry only)
track_a:
  context: 49             # the last 49 pre-contact frames (2.0 s at 24 fps), 8k+1
  align: 8
prompt_template: scene    # the card asks for long, elaborate English prompts; pre-contact facts only
