input:
  center_on_contact: false            # 5.0 s from frame 0; contact at input frames ~37-43
token_grid: {patch: 2, vae_spatial: 8, vae_temporal: 4}   # 21 latent frames x 30 x 52 tokens, 5120-d
layers: [0, 4, 8, 12, 16, 20, 24, 28, 32, 36, 39]   # 40 blocks
encode_snr_db: [-20, -8, 0, 8]
