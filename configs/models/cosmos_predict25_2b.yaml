# Cosmos-Predict2.5-2B Video2World (spec §4.2 group 4, P0): output track A only (physlaw/models/cosmos_predict.py).
# Gated on the Hub: accept the licenses of nvidia/Cosmos-Predict2.5-2B and nvidia/Cosmos-Guardrail1 (automatic) and
# meta-llama/Llama-Guard-3-8B (manual approval; the guardrail uses it), then `hf auth login`.
# OFFICIAL settings: NVIDIA's github.com/nvidia-cosmos/cosmos-predict2.5 (docs/diffusers_inference.md and
# scripts/diffusers_inference.py: revision diffusers/base/post-trained, num_output_frames 93 "default & recommended",
# num_steps 36, saved at 16 fps; config.py: guidance 7, the default negative prompt, Video2World = 2 latent
# conditional frames = the input's last 5 frames) and diffusers' Cosmos2_5_PredictBasePipeline defaults
# (704 x 1280, conditional_frame_timestep 0.0001, the shipped UniPC scheduler). The model was trained at 720p, 16 fps.
name: cosmos-predict2.5-2b
kind: generator
output_track: A        # scripts/07_generate_outputs.py
hf_id: nvidia/Cosmos-Predict2.5-2B
revision: 0d37c7498f54cee3c599d438d895a0a4a8608064   # head of branch diffusers/base/post-trained (2026-11-10)
local_path: ${env:PHYSLAW_MODELS,/root/models}/Cosmos-Predict2.5-2B
dtype: bfloat16
min_diffusers: 0.39.0     # runs in /root/envs/cosmos_venv (scripts/00_setup_envs.sh, PHYSLAW_COSMOS=1)
official:
  height: 704
  width: 1280
  num_frames: 93
  fps: 16
  num_inference_steps: 36
  guidance_scale: 7.0
  num_latent_conditional_frames: 2
  conditional_frame_timestep: 0.0001
  scheduler: UniPCMultistepScheduler
  negative_prompt: "The video captures a series of frames showing ugly scenes, static with no motion, motion blur, over-saturation, shaky footage, low resolution, grainy texture, pixelated images, poorly lit areas, underexposed and overexposed scenes, poor color balance, washed out colors, choppy sequences, jerky movements, low frame rate, artifacting, color banding, unnatural transitions, outdated special effects, fake elements, unconvincing visuals, poorly edited content, jump cuts, visual noise, and flickering. Overall, the video is of poor quality."
input:
  center_on_contact: false            # 93 frames at 16 fps from frame 0 (277 of 289 master frames)
token_grid: {patch: 2, vae_spatial: 8, vae_temporal: 4}   # Wan2.1 VAE; used for the context length only
prompt_template: scene     # physlaw.models.dit.scene_prompt: long, literal, pre-contact facts only
