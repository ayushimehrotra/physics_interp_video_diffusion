# Wan2.1-VACE-1.3B (spec §4.2 group 4): output track A route for Wan2.1-T2V-1.3B through its OFFICIAL sibling
# (``track_a_mode: variant``; physlaw/models/wan_vace.py). Apache-2.0, not gated. diffusers WanVACEPipeline
# (diffusers >= 0.34; physics_venv 0.35.1). VACE "firstclip" extension: the window's pre-contact frames given and
# masked known (0), the rest grey (127.5) and masked to generate (255) (ali-vilab/VACE frameref.py).
# OFFICIAL settings, github.com/Wan-Video/Wan2.1 generate.py (VACE task defaults; = the model card's README):
# VACE-1.3B "Supports 480P" -> 832*480; frame_num 81; 16 fps (shared_config); sample_steps 50; sample_shift 16
# ("vace" in task); sample_guide_scale 5.0; the shared negative prompt. (The diffusers docstring example instead
# uses 30 steps and flow_shift 3.0 for 480P: not used.) Transformer + text encoder bf16, VAE fp32 (card).
name: wan2.1-vace-1.3b
kind: generator
output_track: A
track_a_mode: variant     # official frame-conditioned sibling of Wan2.1-T2V-1.3B
hf_id: Wan-AI/Wan2.1-VACE-1.3B-diffusers
revision: ec4d2cb062b548996b179d493fdd05340de702a1
local_path: ${env:PHYSLAW_MODELS,/root/models}/Wan2.1-VACE-1.3B-diffusers
dtype: bfloat16
official:
  height: 480
  width: 832
  num_frames: 81          # 4N+1; 5.0 s at 16 fps
  fps: 16
  num_inference_steps: 50
  guidance_scale: 5.0
  scheduler: UniPCMultistepScheduler   # flow_prediction (shipped), flow_shift set below as generate.py does
  flow_shift: 16.0
  negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"
input:
  center_on_contact: true             # 81 frames at 16 fps (241 master frames) around contact: ~40 context frames
token_grid: {patch: 2, vae_spatial: 8, vae_temporal: 4}   # Wan2.1 VAE (eval Geometry only)
track_a:
  context: all            # every pre-contact frame of the window, masked known
  align: 1                # VACE masks per pixel frame: no latent alignment needed
prompt_template: scene    # physlaw.models.dit.scene_prompt: pre-contact facts only
