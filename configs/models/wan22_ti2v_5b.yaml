# Wan2.2-TI2V-5B (spec §4.2 group 3 base; §5.1 velocity protocol check) at its OFFICIAL settings, from the official repo
# github.com/Wan-Video/Wan2.2 wan/configs/wan_ti2v_5B.py (= the model card): size 1280*704, frame_num 121, sample_fps 24,
# sample_steps 50, sample_shift 5.0, sample_guide_scale 5.0, the shared negative prompt; scheduler_config.json:
# UniPCMultistepScheduler, flow_prediction, flow_shift 5.0. Transformer + text encoder bf16, VAE fp32 (card).
# expand_timesteps: one timestep per token, so the context is held clean at timestep 0 (physlaw/models/wan.py).
name: wan2.2-ti2v-5b
kind: diffusion
hf_id: Wan-AI/Wan2.2-TI2V-5B-Diffusers
revision: b8fff7315c768468a5333511427288870b2e9635
local_path: ${env:PHYSLAW_MODELS,/root/models}/Wan2.2-TI2V-5B-Diffusers
dtype: bfloat16
official:
  width: 1280
  height: 704
  num_frames: 121         # 5.0 s at 24 fps
  fps: 24
  num_inference_steps: 50
  guidance_scale: 5.0
  scheduler: UniPCMultistepScheduler   # flow_prediction, flow_shift 5.0 (scheduler_config.json)
  flow_shift: 5.0
  negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走"
input:
  center_on_contact: false            # 5.0 s from frame 0; contact at input frames ~56-64
token_grid: {patch: 2, vae_spatial: 16, vae_temporal: 4}  # 31 latent frames x 22 x 40 tokens, 3072-d
layers: [0, 3, 6, 9, 12, 15, 18, 21, 24, 27, 29]
encode_snr_db: [-20, -8, 0, 8]
# --- adapter settings (physlaw/models/wan.py) ---
prompt: "A static camera looks straight down at a flat grey floor. Two balls roll across the floor, collide with each other and bounce apart."
forecast_layers: [6, 15, 24]
surprise: {n_draws: 2}
noise_seed: 0
